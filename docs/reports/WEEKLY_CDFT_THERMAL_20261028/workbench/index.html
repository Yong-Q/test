0, "y": 30, "label": "锁定体系\n分子 / 势 / 条件", "state": "partial", "detail": "六分子和教师单点评估已有记录；目标力场适用域、300 K状态点、盒尺寸和物性参考仍逐项确定。", "sources": [{"label": "教师烟测状态", "url": "https://github.com/Yong-Q/symmetrix-polar/blob/68f08d1/docs/results/PATH_B_SIX_MOLECULE_SMOKE_2026-10-22.md"}]}, {"id": "preflight", "x": 335, "y": 30, "label": "引擎预检\n单点 E / F / PBC", "state": "todo", "detail": "OFF源引擎与重算能量有约0.026 meV/atom 去常数波动；邻居表、精度、路径哈希以及目标力等需验证。", "sources": [{"label": "源能量一致性问题", "url": "https://github.com/Yong-Q/test/blob/65a0423/docs/TODO_OFF_POLAR_2026-10-27.md"}]}, {"id": "pilot", "x": 640, "y": 30, "label": "基础轨迹\n每种2个独立副本", "state": "todo", "detail": "建议每分子一个300 K基础状态，2条独立副本；每条0.2 ns平衡+1 ns生产。总12条新轨迹，现有水500 ps只作诊断，需核查可否续跑及均匀性。"}, {"id": "judge", "x": 945, "y": 30, "label": "平衡与相关性\n分块 / 双种子", "state": "todo", "detail": "比较温度、能量、密度、g(r)和慢模态的分块与独立副本；预先制定容差，不能只按固定20ps判断平衡。"}, {"id": "proceed", "x": 1250, "y": 255, "label": "设定候选条件\n温度 / 外场范围", "state": "todo", "detail": "一次对源帧评估目标能量，候选温度/外场在重叠和统计误差可接受范围内后处理复用；不为每个温度/外场自动补轨迹。"}, {"id": "bulk", "x": 30, "y": 255, "label": "体相密度覆盖\n不足时补密度锚点", "state": "todo", "detail": "按需扩展至每分子3个密度锚点、每点2副本：6×3×2=36条源轨迹；NVT单盒固定平均密度，不能承诺不同均匀密度无代价获得。", "sources": [{"label": "采样缺陷审计", "url": "https://github.com/Yong-Q/symmetrix-polar/blob/68f08d1/docs/design/SAMPLING_AUDIT_2026-10-23.md"}]}, {"id": "field", "x": 945, "y": 255, "label": "外场 / 温度重加权\n复用已有源帧", "state": "todo", "detail": "事后从同一批源帧生成候选外场/温度响应；极化随外场变化时目标能量需随场重算，某些态覆盖不足需补模拟。", "sources": [{"label": "水的范围扫描", "url": "https://github.com/Yong-Q/test/tree/65a0423/docs/results/reweight_boundary_scan_20261028"}]}, {"id": "teacher", "x": 1250, "y": 30, "label": "目标势单点\n每帧一次起步", "state": "todo", "detail": "12条1ns轨迹每1ps存1帧，共12000帧、约12000次目标势单点；36条为36000。对仅100帧评分只可使用该100帧，力与场响应可能增加成本。"}, {"id": "quality", "x": 640, "y": 255, "label": "重叠与估计器\n对照 / 统计 / 缺口", "state": "todo", "detail": "2倍波动只是筛选线不是误差保证；检查相关、极端权重、源/目标一致性及必要独立POLAR。存在低重叠时再补采。"}, {"id": "labels", "x": 335, "y": 255, "label": "形成密度 / 关联\n标注可靠范围", "state": "todo", "detail": "c1与c2各有外场、化学势/均匀OZ适用约束；一个轨迹重加权不同条件产生相关剖面，不能计为独立轨迹。"}, {"id": "validate", "x": 335, "y": 480, "label": "独立参考与回归\n预测性质", "state": "todo", "detail": "独立目标MD或MC与材料覆盖验证；c1/c2和cDFT推断均做留出状态、物理量误差与收敛性检验。"}, {"id": "publish", "x": 640, "y": 480, "label": "版本归档\n数据 / 代码 / 报告", "state": "todo", "detail": "记录配置、版本哈希、运行日志、来源、图表与未完成项；保护已有结果。"}], "edges": [["spec", "preflight"], ["preflight", "pilot"], ["pilot", "judge"], ["judge", "teacher"], ["teacher", "proceed"], ["proceed", "field"], ["field", "quality"], ["quality", "labels"], ["labels", "validate"], ["validate", "publish"], ["quality", "bulk"], ["bulk", "pilot"]]}]}</script>

'use strict';
const NS='http://www.w3.org/2000/svg',KEY='cdft-weekly-thermal-20261028-v2';const initial=JSON.parse(document.querySelector('#initial-data').textContent);let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){data=structuredClone(initial)}let view='roadmap',selected=null,drag=null;const svg=document.querySelector('#canvas');const colors={done:['#E6F3F0','#23796F'],partial:['#FFF3DF','#B7791F'],todo:['#FBEAEA','#BC3B38']};const labels={done:'已完成',partial:'部分完成',todo:'待完成 / 未验证'};function el(name,attrs={}){let x=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x}function graph(){return data.graphs.find(g=>g.id===view)}function store(){try{localStorage.setItem(KEY,JSON.stringify(data));document.querySelector('#message').textContent='已保存到本浏览器'}catch(e){document.querySelector('#message').textContent='本地保存不可用，请导出 JSON'}}function validate(d){return d&&Array.isArray(d.graphs)&&['roadmap','sampling'].every(id=>{let g=d.graphs.find(x=>x.id===id);if(!g||!Array.isArray(g.nodes)||!Array.isArray(g.edges))return false;let ids=new Set(g.nodes.map(n=>n.id));return ids.size===g.nodes.length&&g.nodes.every(n=>typeof n.label==='string'&&typeof n.detail==='string'&&Number.isFinite(n.x)&&Number.isFinite(n.y)&&colors[n.state])&&g.edges.every(e=>Array.isArray(e)&&e.length===2&&ids.has(e[0])&&ids.has(e[1]))})}if(!validate(data))data=structuredClone(initial);
function render(){svg.replaceChildren();let defs=el('defs');let marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});let tri=el('path',{d:'M0,0 L10,5 L0,10 Z',fill:'#8295a1'});marker.append(tri);defs.append(marker);svg.append(defs);let g=graph(),nodes=Object.fromEntries(g.nodes.map(n=>[n.id,n]));for(let [src,dst] of g.edges){let a=nodes[src],b=nodes[dst];let x1=a.x+130,y1=a.y+110,x2=b.x+130,y2=b.y;if(Math.abs(b.x-a.x)>Math.abs(b.y-a.y)){x1=a.x+(b.x>a.x?260:0);y1=a.y+55;x2=b.x+(b.x>a.x?0:260);y2=b.y+55}let path=el('path',{d:`M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`,fill:'none',stroke:'#8295a1','stroke-width':'2','marker-end':'url(#arrow)'});svg.append(path)}for(let n of g.nodes){let box=el('g',{class:'node','data-id':n.id,transform:`translate(${n.x},${n.y})`,tabindex:'0',role:'button','aria-label':n.label.replace(/\n/g,' ')});let rect=el('rect',{width:260,height:110,rx:8,fill:colors[n.state][0],stroke:colors[n.state][1],'stroke-width':selected===n.id?4:2});box.append(rect);let txt=el('text',{x:130,y:34,'text-anchor':'middle',fill:'#233944','font-size':'19','font-weight':'600'});n.label.split('\n').slice(0,3).forEach((line,i)=>{let t=el('tspan',{x:130,dy:i===0?0:24});t.textContent=line;txt.append(t)});box.append(txt);let state=el('text',{x:130,y:94,'text-anchor':'middle',fill:colors[n.state][1],'font-size':'14'});state.textContent=labels[n.state];box.append(state);box.addEventListener('pointerdown',e=>{selected=n.id;drag={id:n.id,startX:e.clientX,startY:e.clientY,ox:n.x,oy:n.y,moved:false};svg.setPointerCapture(e.pointerId);openNode(n)});box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){selected=n.id;openNode(n);render()}});svg.append(box)}}function openNode(n){document.querySelector('#editor').hidden=false;document.querySelector('#hint').textContent='当前：'+n.id;document.querySelector('#label').value=n.label;document.querySelector('#status').value=n.state;document.querySelector('#detail').value=n.detail;let area=document.querySelector('#sources');area.replaceChildren();for(const item of (n.sources||[])){if(!/^https:\/\//.test(item.url))continue;let link=document.createElement('a');link.href=item.url;link.textContent=item.label;link.target='_blank';link.rel='noopener noreferrer';let para=document.createElement('p');para.append(link);area.append(para)}}svg.addEventListener('pointermove',e=>{if(!drag)return;let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let p=pt.matrixTransform(svg.getScreenCTM().inverse());pt.x=drag.startX;pt.y=drag.startY;let o=pt.matrixTransform(svg.getScreenCTM().inverse());let n=graph().nodes.find(x=>x.id===drag.id);n.x=Math.max(0,Math.min(1290,drag.ox+p.x-o.x));n.y=Math.max(0,Math.min(550,drag.oy+p.y-o.y));drag.moved=true;render()});svg.addEventListener('pointerup',()=>{if(drag){store();drag=null}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;document.querySelector('#editor').hidden=true;document.querySelector('#hint').textContent='点击图中的节点。编辑后选择“保存修改”。';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('primary',x===b));render()});document.querySelector('#save').onclick=()=>{let n=graph().nodes.find(x=>x.id===selected);if(!n)return;n.label=document.querySelector('#label').value.trim()||n.label;n.state=document.querySelector('#status').value;n.detail=document.querySelector('#detail').value;store();render()};function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelector('#export').onclick=()=>download('cdft-flow-edited.json',JSON.stringify(data,null,2),'application/json');document.querySelector('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!validate(d))throw Error('节点或连线结构不符合格式');data=d;selected=null;document.querySelector('#editor').hidden=true;store();render()}catch(err){alert('导入失败：'+err.message)}e.target.value=''};document.querySelector('#svgout').onclick=()=>{let clone=svg.cloneNode(true);clone.setAttribute('xmlns',NS);clone.setAttribute('width','1550');clone.setAttribute('height','660');download('cdft-'+view+'.svg',new XMLSerializer().serializeToString(clone),'image/svg+xml')};document.querySelector('#reset').onclick=()=>{if(confirm('恢复初始流程图？请先导出需要保留的修改。')){data=structuredClone(initial);selected=null;document.querySelector('#editor').hidden=true;store();render()}};render();
</script></body></html>
