name: engine bundle

# Publishes the prebuilt, self-contained engine bundle in dist/.
#
#   manual: Actions -> engine bundle -> Run workflow   (artifact only)
#   release: git tag bundle-v0.1.1 && git push origin bundle-v0.1.1
#
# The "bundle-" prefix keeps this out of the v* tag path, which wheels.yml owns
# (that one builds and publishes the PyPI wheel).
#
# Rebuild the bundle after a new lmp binary with
#   LMP=bin/lmp scripts/make_lmp_bundle.sh
# and commit dist/*.tar.gz (LFS) together with dist/*.tar.gz.sha256.
on:
  workflow_dispatch:
  push:
    tags: ["bundle-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify bundle
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.tar.gz.sha256
          tar xzf ./*.tar.gz -C /tmp
          cd /tmp/maceles-lmp-env-*
          sha256sum -c MANIFEST.sha256
          echo "--- BUILD_INFO ---"; cat BUILD_INFO.txt
          test -x bin/lmp && test -x bin/lmp-run && test -f env.sh
          head -c 4 bin/lmp | grep -q ELF

          # Load the bundle's own libraries first, exactly as a user would.
          . ./env.sh
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          ldd bin/lmp | sed -n '1,40p'

          # A hosted runner has no GPU or CUDA toolkit, so libcublas/libcuda
          # stay unresolved.  Everything else must come from lib/.
          missing=$(ldd bin/lmp | awk '/not found/{print $1}' \
                    | grep -Ev '^lib(cublas|cublasLt|cuda)\.so' || true)
          if [ -n "$missing" ]; then
            echo "::error::unexpected missing libraries: $missing"
            exit 1
          fi
          echo "bundle self-check OK"


      - uses: actions/upload-artifact@v4
        with:
          name: maceles-lmp-env
          path: dist/*.tar.gz*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/bundle-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
